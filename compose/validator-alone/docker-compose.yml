# validator-alone — standalone validator (PEX disabled, no co-located
# sentry) + otel-collector for telemetry. 100% configurable via .env (cp
# .env.example .env). See DEPLOYMENT_RUNBOOK.md for the expected layout
# (entrypoint.sh, config.toml, genesis.json, otel/otel-config.yaml next to
# this file) and the manual deployment procedure.
#
# otel-collector stays on 127.0.0.1: no metrics port is exposed publicly,
# Alloy (base_setup role) scrapes it locally and pushes remote_write to the
# metrics backend (see NETWORK_AND_REVERSE_PROXY.md).
#
# TMKMS_* below are optional: leave them empty (default) to keep signing
# local, unchanged. Fill them in to externalize consensus signing to a
# dedicated tmkms signer host over TCP — see compose/tmkms-alone/,
# roles/tmkms (tmkms_connection_mode: "tcp") and TMKMS.md §4.
# entrypoint.sh already handles these generically, no change needed there.

services:
  validator:
    image: "${IMAGES}"
    restart: on-failure
    ports:
      - "26656:26656"
      - "127.0.0.1:26657:26657"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./config.toml:/gnoroot/config.toml:ro
      - ./genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./gnoland-data:/gnoroot/gnoland-data
    entrypoint: /entrypoint.sh
    environment:
      MONIKER: "${MONIKER}"
      PERSISTENT_PEERS: "${PERSISTENT_PEERS}" # p2p_address of the sentry
      PEX: "false"
      MAX_PEERS: 2
      INBOUND: 0
      # Optional — remote tmkms signer over TCP (see header comment above).
      TMKMS_CHAIN_ID: "${TMKMS_CHAIN_ID:-}"
      TMKMS_LISTEN_ADDR: "${TMKMS_LISTEN_ADDR:-}"
      TMKMS_ALLOWED_KMS_PUBKEYS: "${TMKMS_ALLOWED_KMS_PUBKEYS:-}"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: on-failure
    container_name: otel-collector
    volumes:
      - ./otel/otel-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:9464:9464" # Prometheus exposition — scraped locally by Alloy
      - "127.0.0.1:4317:4317" # OTLP gRPC — gnoland exports its telemetry here
