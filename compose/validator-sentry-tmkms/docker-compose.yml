# validator-sentry-tmkms — public sentry + private validator + tmkms sidecar
# (softsign, externalized signing) on the same host. 100% configurable via
# .env (cp .env.example .env). See DEPLOYMENT_RUNBOOK.md for the expected
# layout:
#   ./sentry/{entrypoint.sh,config.toml,genesis.json,gnoland-data/}
#   ./validator/{entrypoint.sh,config.toml,genesis.json,gnoland-data/,otel/otel-config.yaml}
#   ./tmkms/{tmkms.toml,secrets/,run/}   (staged by `setup-tmkms.yml`, NOT by hand)
#
# tmkms.toml + secrets/ (consensus.key, kms-identity.key) are generated by
# the tmkms role (setup-tmkms.yml) from gnoland secrets already initialized
# manually (gnoland secrets init) — never by this compose or by Ansible on
# the gnoland-secrets side.

services:

  sentry:
    image: "${IMAGES}"
    restart: on-failure
    ports:
      - "26656:26656"
      - "127.0.0.1:26657:26657"
    volumes:
      - ./sentry/entrypoint.sh:/entrypoint.sh:ro
      - ./sentry/config.toml:/gnoroot/config.toml:ro
      - ./sentry/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./sentry/gnoland-data:/gnoroot/gnoland-data
    entrypoint: /entrypoint.sh
    environment:
      MONIKER: "${MONIKER_SENTRY}"
      SEEDS: "${SEEDS}"
      PERSISTENT_PEERS: "${PERSISTENT_PEERS}"
      PRIVATE_PEER_IDS: "${PRIVATE_PEER_IDS}" # validator's node_id (p2p_address)
      PEX: "true"

  validator:
    image: "${IMAGES}"
    restart: on-failure
    ports:
      - "127.0.0.1:26658:26657"
    volumes:
      - ./validator/entrypoint.sh:/entrypoint.sh:ro
      - ./validator/config.toml:/gnoroot/config.toml:ro
      - ./validator/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./validator/gnoland-data:/gnoroot/gnoland-data
      # tmkms sidecar: shared dir where gnoland creates the privval socket
      - ./tmkms/run:/run/gnoland
    entrypoint: /entrypoint.sh
    environment:
      MONIKER: "${MONIKER_VAL}"
      PERSISTENT_PEERS: "${PERSISTENT_PEERS_VALIDATOR}"
      PEX: "false"
      MAX_PEERS: 1
      INBOUND: 0
      # Externalize consensus signing to the same-host tmkms sidecar
      # (entrypoint.sh turns these into the tmkms_listener fields, listen_addr
      # last — see validator/entrypoint.sh).
      TMKMS_CHAIN_ID: "${TMKMS_CHAIN_ID}"
      TMKMS_LISTEN_ADDR: "unix:///run/gnoland/privval.sock"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: on-failure
    container_name: otel-collector
    volumes:
      - ./validator/otel/otel-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:9464:9464" # Prometheus exposition — scraped locally by Alloy
      - "127.0.0.1:4317:4317" # OTLP gRPC — gnoland (validator) exports its telemetry here

  # tmkms signer sidecar (softsign). Dials the privval socket gnoland creates;
  # reconnect=true retries until the validator is up. Runs as root (like the
  # validator), so the 0600 socket is reachable on both ends.
  tmkms:
    image: "${TMKMS_IMAGE:-tmkms:local}"
    restart: on-failure
    command: ["start", "-c", "/tmkms/tmkms.toml"]
    volumes:
      - ./tmkms/tmkms.toml:/tmkms/tmkms.toml:ro
      - ./tmkms/secrets:/tmkms/secrets
      - ./tmkms/run:/run/gnoland
