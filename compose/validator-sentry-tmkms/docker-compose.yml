# validator-sentry-tmkms — sentry publique + validateur privé + sidecar tmkms
# (softsign, signature externalisée) sur le même hôte. 100% configurable via
# .env (cp .env.example .env). Voir DEPLOYMENT_RUNBOOK.md pour l'arborescence
# attendue :
#   ./sentry/{entrypoint.sh,config.toml,genesis.json,gnoland-data/}
#   ./validator/{entrypoint.sh,config.toml,genesis.json,gnoland-data/,otel/otel-config.yaml}
#   ./tmkms/{tmkms.toml,secrets/,run/}   (staged par `setup-tmkms.yml`, PAS à la main)
#
# tmkms.toml + secrets/ (consensus.key, kms-identity.key) sont générés par le
# rôle tmkms (setup-tmkms.yml) à partir des secrets gnoland déjà initialisés
# manuellement (gnoland secrets init) — jamais par ce compose ni par Ansible
# côté secrets gnoland eux-mêmes.

services:

  sentry:
    image: "${IMAGES}"
    restart: on-failure
    ports:
      - "26656:26656"
      - "127.0.0.1:26657:26657"
    volumes:
      - ./sentry/entrypoint.sh:/entrypoint.sh:ro
      - ./sentry/config.toml:/gnoroot/config.toml:ro
      - ./sentry/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./sentry/gnoland-data:/gnoroot/gnoland-data
    entrypoint: /entrypoint.sh
    environment:
      MONIKER: "${MONIKER_SENTRY}"
      SEEDS: "${SEEDS}"
      PERSISTENT_PEERS: "${PERSISTENT_PEERS}"
      PRIVATE_PEER_IDS: "${PRIVATE_PEER_IDS}" # node_id du validateur (p2p_address)
      PEX: "true"

  validator:
    image: "${IMAGES}"
    restart: on-failure
    ports:
      - "127.0.0.1:26658:26657"
    volumes:
      - ./validator/entrypoint.sh:/entrypoint.sh:ro
      - ./validator/config.toml:/gnoroot/config.toml:ro
      - ./validator/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./validator/gnoland-data:/gnoroot/gnoland-data
      # sidecar tmkms : répertoire partagé où gnoland crée le socket privval
      - ./tmkms/run:/run/gnoland
    entrypoint: /entrypoint.sh
    environment:
      MONIKER: "${MONIKER_VAL}"
      PERSISTENT_PEERS: "${PERSISTENT_PEERS_VALIDATOR}"
      PEX: "false"
      MAX_PEERS: 1
      INBOUND: 0
      # Externalise la signature consensus vers le sidecar tmkms du même hôte
      # (entrypoint.sh transforme ces variables en champs tmkms_listener,
      # listen_addr en dernier — voir validator/entrypoint.sh).
      TMKMS_CHAIN_ID: "${TMKMS_CHAIN_ID}"
      TMKMS_LISTEN_ADDR: "unix:///run/gnoland/privval.sock"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: on-failure
    container_name: otel-collector
    volumes:
      - ./validator/otel/otel-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:9464:9464" # exposition Prometheus — scrapée localement par Alloy
      - "127.0.0.1:4317:4317" # OTLP gRPC — gnoland (validator) y exporte sa télémétrie

  # sidecar de signature tmkms (softsign). Se connecte au socket privval créé
  # par gnoland ; reconnect=true retente jusqu'à ce que le validateur soit up.
  # Tourne en root (comme le validateur) pour accéder au socket 0600.
  tmkms:
    image: "${TMKMS_IMAGE:-tmkms:local}"
    restart: on-failure
    command: ["start", "-c", "/tmkms/tmkms.toml"]
    volumes:
      - ./tmkms/tmkms.toml:/tmkms/tmkms.toml:ro
      - ./tmkms/secrets:/tmkms/secrets
      - ./tmkms/run:/run/gnoland
