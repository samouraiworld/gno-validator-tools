---
# tasks file for roles/ufw
- name: STOP UFW 
  shell: |
    ufw disable 

- name: Reset UFW (clear all rules)
  ufw:
    state: reset

- name: Autorize SSH
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow required ports per host
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_ports_app }}"
  when: ufw_ports_app is defined and ufw_ports_app | length > 0

- name: Allow ports from monitoring server
  ufw:
    rule: allow
    from_ip: "{{ ufw_allow_ip }}"
    to_port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_ports_moni }}"
  when: ufw_ports_moni is defined and ufw_ports_moni | length > 0

- name: Allow tmkms TCP signer port from the signer host only
  ufw:
    rule: allow
    from_ip: "{{ ufw_tmkms_signer_ip }}"
    to_port: "{{ ufw_tmkms_port | string }}"
    proto: tcp
  when: >-
    ufw_tmkms_port is defined and ufw_tmkms_port | string | length > 0
    and ufw_tmkms_signer_ip is defined and ufw_tmkms_signer_ip | length > 0

- name: Enable UFW
  ufw:
    state: enabled
# --- DOCKER-USER source pinning ---------------------------------------------
# Everything above only affects the INPUT chain. Ports published by Docker
# containers bypass it entirely (FORWARD: DOCKER-USER -> DOCKER-FORWARD ->
# ufw-*), so gnoland's 26656/26659 are NOT protected by the rules above.
# See roles/ufw/defaults/main.yml and TMKMS.md section 4.
- name: Install DOCKER-USER rules script
  ansible.builtin.template:
    src: docker-user-rules.sh.j2
    dest: /usr/local/sbin/docker-user-rules.sh
    mode: "0750"
  when: docker_user_rules | length > 0
  notify: Reapply docker-user rules

- name: Install DOCKER-USER rules systemd unit
  ansible.builtin.template:
    src: docker-user-rules.service.j2
    dest: /etc/systemd/system/docker-user-rules.service
    mode: "0644"
  when: docker_user_rules | length > 0
  notify: Reapply docker-user rules

- name: Enable DOCKER-USER rules at boot
  ansible.builtin.systemd:
    name: docker-user-rules.service
    enabled: true
    state: started
    daemon_reload: true
  when: docker_user_rules | length > 0
