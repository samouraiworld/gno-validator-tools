---
# =============================================================================
# Install stuck-node detection + auto-restore on the sentry AND the validator.
# Snapshots come from Scaleway Object Storage (roles/snapshotter, sentry-only,
# must already be running and pushing).
#
#   ansible-playbook -i inventory.yaml install-autoheal.yml --tags autoheal
#
# This playbook runs BOTH plays every time, against the `sentries` and
# `validators` inventory groups. Use --limit <host> to touch only one host in
# a given run. To retarget, use -e sentry_target=<host-or-group> and/or
# -e validator_target=<host-or-group> — deliberately NOT a single `target`,
# which both plays would pick up and apply the sentry play to validators.
#
# `gno_dir`, `autoheal_chain_id`, `autoheal_s3_bucket` and `autoheal_s3_prefix`
# must be set in inventory (host_vars/group_vars) — they are deliberately NOT
# play vars here, because play vars outrank inventory and would silently
# freeze every environment to one value. If they are set nowhere, Ansible
# fails with an explicit undefined/empty error, which is the correct
# fail-closed behaviour.
#
# autoheal_s3_prefix MUST match the prefix the sentry's roles/snapshotter
# writes to (snapshotter_s3_prefix, default "{{ inventory_hostname }}/snapshotter").
# A mismatch means autoheal silently finds no snapshot to restore from.
#
# /!\ TMKMS TOPOLOGY: roles/autoheal drives tmkms with `docker compose stop
# <service> tmkms` inside the node's OWN deploy dir. That only works for a
# co-located UDS sidecar (compose/validator-sentry-tmkms/). With a dedicated
# TCP signer host (compose/tmkms-alone/), the remote tmkms is NOT stopped
# before the chain data is wiped and the restart step fails — see TMKMS.md
# section 4. Do not enable autoheal on validators in that topology.
#
# The role stages the scripts + systemd timer but does NOT enable it. Finish
# on each host: fill .env (read-only Scaleway key + webhook URL), then
# `systemctl enable --now gno-autoheal-check.timer`. See roles/autoheal/README.md.
# =============================================================================

- name: Install auto-heal on the sentry
  hosts: "{{ sentry_target | default('sentries') }}"
  become: false

  vars:
    autoheal_enabled: true
    autoheal_node_type: sentry

  tasks:
    - name: Deploy autoheal role (sentry)
      ansible.builtin.include_role:
        name: autoheal
      when: autoheal_enabled | default(false) | bool
      tags: [autoheal]

- name: Install auto-heal on the validator
  hosts: "{{ validator_target | default('validators') }}"
  become: false

  vars:
    autoheal_enabled: true
    autoheal_node_type: validator

  tasks:
    - name: Deploy autoheal role (validator)
      ansible.builtin.include_role:
        name: autoheal
      when: autoheal_enabled | default(false) | bool
      tags: [autoheal]
